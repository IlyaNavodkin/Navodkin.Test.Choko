name: Build desktop binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed (defaults to apps/desktop/package.json)
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package versions
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          root="$(node -p "require('./app/package.json').version")"
          desktop="$(node -p "require('./app/apps/desktop/package.json').version")"
          if [ "$root" != "$tag" ] || [ "$desktop" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package versions (root=$root, desktop=$desktop). Bump both package.json files first."
            exit 1
          fi

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            value="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            value="${GITHUB_REF_NAME#v}"
          else
            value="$(node -p "require('./app/apps/desktop/package.json').version")"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Build portable app
        working-directory: app
        env:
          CHOKO_VERSION: ${{ steps.version.outputs.value }}
        run: pnpm --filter @choko/desktop package:win

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        working-directory: app/apps/desktop
        shell: pwsh
        env:
          CHOKO_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DMyAppVersion=$env:CHOKO_VERSION" 'build-resources\choko.iss'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: choko-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            app/apps/desktop/build/Choko-*-win-x64.zip
            app/apps/desktop/build/Choko-Setup-*.exe

  macos:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package versions
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          root="$(node -p "require('./app/package.json').version")"
          desktop="$(node -p "require('./app/apps/desktop/package.json').version")"
          if [ "$root" != "$tag" ] || [ "$desktop" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package versions (root=$root, desktop=$desktop). Bump both package.json files first."
            exit 1
          fi

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            value="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            value="${GITHUB_REF_NAME#v}"
          else
            value="$(node -p "require('./app/apps/desktop/package.json').version")"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        working-directory: app
        env:
          CHOKO_VERSION: ${{ steps.version.outputs.value }}
        run: pnpm --filter @choko/desktop package:mac

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: choko-macos-arm64
          if-no-files-found: error
          retention-days: 7
          path: app/apps/desktop/build/Choko-*-mac-arm64.zip

  release:
    name: Attach binaries to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
