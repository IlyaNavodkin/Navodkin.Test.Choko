[package]
name = "testoritto-desktop"
version = "0.1.0"
description = "Testoritto desktop app"
authors = ["Testoritto"]
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
notify = "=8.2.0"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "=0.10.9"
serde_norway = "=0.9.42"
tempfile = "=3.27.0"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.2"
uuid = { version = "=1.28.0", features = ["v4"] }
yaml-edit = "=0.2.3"
yaml-serde-edit = "=0.1.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
