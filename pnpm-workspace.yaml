packages:
  - ui
  - apps/ui-playground
  - apps/desktop
  - tools/playwright-automation

storeDir: .pnpm-store
allowBuilds:
  esbuild: true
  # The package's postinstall only prints promotional/compatibility messages.
  '@tsparticles/engine': false
minimumReleaseAgeExclude:
  - '@playwright/test@1.64.1'
  - playwright-core@1.64.1
  - playwright@1.64.1
